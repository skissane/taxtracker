# Fly.io deployment (see issue #47). Fly runs the image CI publishes to GHCR
# from master; nothing is built on Fly. CI deploys each commit's image by
# digest (`fly deploy --image ...@sha256:...`); a manual `fly deploy` deploys
# whatever :latest is, i.e. master's most recently published image.
#
# The production app's name is deliberately not in this file, to keep it out
# of the public repo: CI gets it from the FLY_APP repo secret, and flyctl reads
# FLY_APP from the environment, so export it (or pass -a) for manual commands.
# The Machine's ALLOWED_HOSTS and backup hostname default from FLY_APP_NAME,
# which Fly sets at runtime (see settings.py).
#
# One-time setup: `just fly-setup` (see fly-setup.sh and README.md) creates the
# app, the volume below, the Fly secrets (initial admin password and S3
# settings) and the GitHub secrets from .env.
#
# On first boot, ensure_superuser creates `admin` with the password from the
# LIFETRACKER_INITIAL_ADMIN_PASSWORD secret.

primary_region = "syd"

[build]
  image = "ghcr.io/skissane/taxtracker:latest"

[env]
  # Fly's proxy terminates TLS and always sets X-Forwarded-Proto.
  LIFETRACKER_TRUST_X_FORWARDED_PROTO = "1"
  # The idle watchdog (lifetracker/core/idle_watchdog.py) stops the Machine
  # once nothing has used it for a while. Unlike Fly Proxy's auto-stop, which
  # is off below, it counts SSH sessions as activity (issue #135).
  LIFETRACKER_IDLE_STOP = "stop"
  # Fly timestamps every log line itself, so don't add a second one.
  LIFETRACKER_LOG_TIMESTAMPS = "0"

# The idle watchdog stops the Machine by making gunicorn exit 0. on-failure
# (what `fly deploy` uses when none is set) restarts the Machine only after a
# non-zero exit, so a clean exit leaves it stopped until Fly Proxy starts it.
# After 10 failed restarts in a row it gives up and leaves the Machine stopped.
[[restart]]
  policy = "on-failure"
  retries = 10

# The volume holds the SQLite database and secret key (LIFETRACKER_DATA_DIR is
# /data in the image). A volume attaches to a single Machine, so the app must
# run exactly one: CI deploys with --ha=false, and so should a manual deploy.
[mounts]
  source = "lifetracker_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Fly Proxy only sees HTTP through itself, not SSH sessions, so it could
  # stop the Machine mid-session; the idle watchdog stops it instead (see
  # [env]). The proxy still starts it on the next request, which waits for
  # boot and migrations (a few seconds).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # 256MB is tight for Django plus the cloud backup, which holds a serialised
  # copy of the whole database in memory.
  memory = "512mb"
