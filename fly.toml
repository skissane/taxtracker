# Fly.io deployment (see issue #47). Fly runs the image CI publishes to GHCR
# from master; nothing is built on Fly. CI deploys each commit's image by
# digest (`fly deploy --image ...@sha256:...`); a manual `fly deploy` deploys
# whatever :latest is, i.e. master's most recently published image.
#
# The production app's name is deliberately not in this file, to keep it out
# of the public repo: CI gets it from the FLY_APP repo secret, and flyctl reads
# FLY_APP from the environment, so export it (or pass -a) for manual commands.
# The Machine's ALLOWED_HOSTS and backup hostname default from FLY_APP_NAME,
# which Fly sets at runtime (see settings.py).
#
# One-time setup before the first deploy (with FLY_APP exported):
#   fly apps create "$FLY_APP"
#   fly volumes create lifetracker_data --region syd --size 1
#   fly secrets set LIFETRACKER_BACKUP_S3_BUCKET_NAME=... \
#     LIFETRACKER_BACKUP_S3_ACCESS_KEY_ID=... \
#     LIFETRACKER_BACKUP_S3_SECRET_ACCESS_KEY=...
#
# On first boot, ensure_superuser creates `admin` with a random password and
# prints it to `fly logs`, unless /data/initial_admin_password already exists.

primary_region = "syd"

[build]
  image = "ghcr.io/skissane/taxtracker:latest"

[env]
  # Fly's proxy terminates TLS and always sets X-Forwarded-Proto.
  LIFETRACKER_TRUST_X_FORWARDED_PROTO = "1"

# The volume holds the SQLite database and secret key (LIFETRACKER_DATA_DIR is
# /data in the image). A volume attaches to a single Machine, so the app must
# run exactly one: deploy with `fly deploy --ha=false` the first time.
[mounts]
  source = "lifetracker_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Stop the Machine when idle and start it on the next request. The first
  # request after a stop waits for boot and migrations (a few seconds).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # 256MB is tight for Django plus the cloud backup, which holds a serialised
  # copy of the whole database in memory.
  memory = "512mb"
