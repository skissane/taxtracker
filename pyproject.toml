[project]
name = "lifetracker"
version = "0.1.0"
description = "Personal life admin tracker app, with tax and task tracking modules"
readme = "README.md"
requires-python = "~=3.14.9"
dependencies = [
    "boto3>=1.43.111",
    "click>=8.5.0",
    "django>=6.1.2",
    "django-google-sso>=10.0.0",
    "gunicorn>=26.2.0",
    "maxminddb>=3.2.0",
    "pdfkit>=1.0.0",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
lifetracker-cli = "lifetracker.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifetracker"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "djlint>=1.46.4",
    "jactionlint>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
screenshots = [
    "playwright>=1.64.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID252", "PLC0415", "RUF100"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
blank_line_after_tag = "load,extends"
ignore = "H030,H031"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lifetracker.settings"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-n auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/lifetracker", "scripts"]
omit = ["*/migrations/*"]
parallel = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = false

[tool.uv]
# Older uv writes uv.lock in an older format; keep CI's and the Dockerfile's pin
# at or above this.
required-version = ">=0.13.5"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
