[project]
name = "lifetracker"
version = "0.1.0"
description = "Personal life admin tracker app (tax tracking is its first module)"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "click>=8.4.2",
    "django>=6.1.1",
    "gunicorn==26.0.0",
    "pdfkit>=1.0.0",
]

[project.scripts]
lifetracker-cli = "lifetracker.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifetracker"]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "djlint>=1.46.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID252", "PLC0415"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
blank_line_after_tag = "load,extends"
ignore = "H030,H031"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lifetracker.settings"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-n auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/lifetracker"]
omit = ["*/migrations/*"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
