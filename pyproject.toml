[project]
name = "lifetracker"
version = "0.1.0"
description = "Personal life admin tracker app, with tax and task tracking modules"
readme = "README.md"
requires-python = "~=3.14.9"
dependencies = [
    "boto3>=1.43.118",
    "click>=8.5.0",
    "django>=6.1.2",
    "django-google-sso>=10.0.0",
    "django-stubs-ext>=6.1.2",
    "gunicorn>=26.2.0",
    "maxminddb>=3.2.0",
    "pdfkit>=1.0.0",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
lifetracker-cli = "lifetracker.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifetracker"]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "diff-cover>=11.0.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djlint>=1.47.0",
    "exolot>=0.5.0",
    "jactionlint>=2.3.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]
screenshots = [
    "playwright>=1.64.1",
]

# Files `just long-files` reports when they're over their limit (see AGENTS.md):
# tracked files matching an `include` glob and no `exclude` one (`*` matches
# `/` too). `limits` maps globs to their own limit, the first match winning
# over `limit`, e.g. "tests/*" = 700.
[tool.lifetracker.long-files]
include = ["*.py"]
exclude = ["*/migrations/*"]
limit = 500
limits = {}

# The policy at the top of the exolot PR comment (see AGENTS.md).
[tool.exolot]
preamble = """
**For information only.** For each finding the PR adds, sketch the fix and judge whether the code would be \
better or worse with it: if better, fix it; if worse, leave it be, as findings don't block the PR. \
Don't suppress one with `NOSONAR` or `noqa`. \
See [AGENTS.md](https://github.com/skissane/taxtracker/blob/master/AGENTS.md) for more.
"""

# Project-wide rule settings (see AGENTS.md): only for rules whose findings here are consistently noise.
[tool.exolot.rules]
# Duplicated string literals: mostly URL names reversed a few times, clearer than a constant.
"python:S1192" = { level = "off" }
# Unused parameters: gunicorn hooks and django-google-sso callbacks have fixed signatures.
"python:S1172" = { level = "off" }
# Local variable naming: `User = get_user_model()` and `apps.get_model()` in migrations are Django idiom.
"python:S117" = { level = "off" }
# <li> outside <ul>/<ol>: the admin's object-tools blocks are inside the parent template's <ul>.
"Web:ItemTagNotWithinContainerTagCheck" = { level = "off" }
# Invariant return value: exit-code functions that deliberately always succeed, and views returning the response
# they modified.
"python:S3516" = { level = "off" }
# Argument types: strict mypy checks these, and does a better job of it (this rule misreads policy.default's
# EmailMessage).
"python:S5655" = { level = "off" }
# ModelForm fields = "__all__": the forms are only used by the admin, which picks the fields itself.
"python:S6559" = { level = "off" }
# Consecutive append() calls: appending output lines one at a time is no less clear than extend().
"python:S9409" = { level = "off" }
# Publicly writable directories and world-readable file modes: the app has one user and runs only in its own
# container or on its owner's machine, so there's no other local user to guard against.
"python:S5443" = { level = "off" }
"python:S2612" = { level = "off" }
# Accessibility: the app's one user doesn't need it.
"Web:S6819" = { level = "off" }
"Web:InputWithoutLabelCheck" = { level = "off" }

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID252", "PLC0415", "RUF100", "TC005"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
blank_line_after_tag = "load,extends"
ignore = "H030,H031"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lifetracker.settings"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-n auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/lifetracker", "scripts"]
# So the reports, and diff-cover's patch coverage (--branch-coverage), show
# untaken branches, such as an if whose else never runs.
branch = true
omit = ["*/migrations/*"]
parallel = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = false

[tool.uv]
# Older uv writes uv.lock in an older format; keep CI's and the Dockerfile's pin
# at or above this.
required-version = ">=0.13.5"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests", "screenshot_tests"]
# Resolve `lifetracker` from src, and `scripts`, `tests` and `screenshot_tests` from the repo root, so each file has
# one module name (otherwise scripts/github_comments.py is both `github_comments` and `scripts.github_comments`).
mypy_path = "src"
explicit_package_bases = true
# Beyond --strict, as in skissane/exolot: unreachable code, unimported types
# that would be Any, and the optional error codes below. explicit-override
# makes every method that overrides one say so with @override, so one that
# stops overriding (the base renamed or removed it) is an error rather than
# silently dead. Not mutable-override, which flags every Django Meta and
# ModelAdmin attribute against django-stubs' types, or disallow_any_decorated,
# which flags Django's view decorators.
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "django_google_sso", "django_google_sso.*", "gunicorn.*", "pdfkit"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "lifetracker.settings"
