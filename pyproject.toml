[project]
name = "lifetracker"
version = "0.1.0"
description = "Personal life admin tracker app, with tax and task tracking modules"
readme = "README.md"
requires-python = "~=3.14.9"
dependencies = [
    "boto3>=1.44.4",
    "click>=8.5.1",
    "django>=6.1.3",
    "django-google-sso>=10.0.0",
    "django-stubs-ext>=6.1.2",
    "gunicorn>=27.0.1",
    "maxminddb>=3.2.0",
    "pdfkit>=1.0.0",
    "pyjwt[crypto]>=2.15.1",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
lifetracker-cli = "lifetracker.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifetracker"]

[dependency-groups]
# Repository checks and CI helpers (see AGENTS.md). Its own group, so CI jobs
# that hold a write-capable token can install it alone, hash-checked against
# uv.lock, with `uv run --only-group repoutils`.
repoutils = ["repoutils>=0.5.4"]
dev = [
    { include-group = "repoutils" },
    "coverage>=7.17.4",
    "diff-cover>=11.0.2",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djlint>=1.51.0",
    "exolot>=0.5.0",
    "jactionlint>=2.6.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]
screenshots = [
    "playwright>=1.65.2",
]

# Settings for repoutils' commands (see AGENTS.md). The comment prefix keeps
# the markers the PR comments had before repoutils, e.g.
# <!-- lifetracker-patch-coverage -->, so they're still found and edited.
[tool.repoutils]
comment-prefix = "lifetracker"
default-branch = "master"

# Files `just long-files` reports when they're over their limit (see AGENTS.md):
# tracked files matching an `include` glob and no `exclude` one (`*` matches
# `/` too). `limits` maps globs to their own limit, the first match winning
# over `limit`, e.g. "tests/*" = 700.
[tool.repoutils.long-files]
include = ["*.py"]
exclude = ["*/migrations/*"]
limit = 500
limits = {}
policy = """\
**For information only.** We aim for files under the limit, but only split one where splitting makes the code \
better, e.g. moving out a cohesive piece that has no reason to sit there, not just to get under the number. \
A long file that is already one cohesive unit can stay as it is, and needs no reply or explanation. \
See [AGENTS.md](https://github.com/skissane/taxtracker/blob/master/AGENTS.md) for more."""

# The suppression comments `just added-strings` points out when a PR adds them
# (see AGENTS.md). Regexes rather than plain strings, so that only a comment
# matches, not a string literal or test data naming one: only whole string
# literals (triple-quoted ones on one line too) come before the #, matched
# possessively so a string isn't reread as shorter ones around a #, and the
# comment can follow an earlier one, as in `# type: ignore # noqa`
# (tests/test_added_strings.py checks them).
[tool.repoutils.added-strings]
include = ["*.py"]

[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"{3}(?:[^"\\]|\\.|"(?!""))*"{3}|'{3}(?:[^'\\]|\\.|'(?!''))*'{3}|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*+#(?:.*#)?\s*(?i:nosonar)\b'''
name = "NOSONAR"
message = "AGENTS.md asks not to suppress exolot's findings: fix the code, or leave the finding as it is"

# ruff reads noqa case-insensitively, and a bare one too.
[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"{3}(?:[^"\\]|\\.|"(?!""))*"{3}|'{3}(?:[^'\\]|\\.|'(?!''))*'{3}|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*+#(?:.*#)?\s*(?i:noqa)\b'''
name = "# noqa"
message = "AGENTS.md asks not to suppress exolot's findings, and a ruff finding is better fixed than suppressed, where you can"

[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"{3}(?:[^"\\]|\\.|"(?!""))*"{3}|'{3}(?:[^'\\]|\\.|'(?!''))*'{3}|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*+#(?:.*#)?\s*type:\s*ignore\b'''
name = "# type: ignore"
message = "please fix the type error instead, if you can"

# The standard recipes (`just check-justfile`) taxtracker leaves out on
# purpose: pyright, as mypy type-checks it, and prose-check from check until
# AGENTS.md and README.md pass it.
[tool.repoutils.justfile]
omit = ["pyright"]
omit-dependencies = { check = ["prose-check"] }

# The platforms uv.lock may have wheels for, as [tool.uv] environments allows
# (`just lock-platforms-check`). uv keeps iOS and Emscripten wheels despite
# environments, so they're tolerated.
[tool.repoutils.lock-platforms]
supported = ["any", "linux:x86_64", "linux:aarch64", "macosx"]
tolerated = ["ios", "pyemscripten"]

# The secrets the workflows use, which `just secrets-workflows-check` checks.
[tool.repoutils.secrets]
actions = ["CLAUDE_CODE_OAUTH_TOKEN", "FLY_API_TOKEN", "FLY_APP", "SCREENSHOTS_TOKEN"]
dependabot = ["DEPENDABOT_FIX_TOKEN"]
# fix-push.yml pushes /autofix's commits to a PR's branch with this; only
# master can deploy to the autofix environment.
environments.autofix = ["AUTOFIX_TOKEN"]

# The GitHub settings below are what `just github-settings-check` checks and
# `just github-settings-ensure` applies (see AGENTS.md's GitHub settings).
# Both need a token with administration access, which CI and Claude Code
# sessions don't have, so the owner runs them.

# The repository settings `repoutils repo-settings` checks or changes.
[tool.repoutils.repo-settings]
description = "Personal life tracker app"
homepage = ""
issues = true
projects = true
wiki = true
discussions = false
pull-requests = true
pull-request-creation = "collaborators"
merge-commit = { allow = false }
squash-merge = { allow = true, title = "pr-title", message = "blank" }
rebase-merge = { allow = false }
allow-auto-merge = true
allow-update-branch = true
delete-branch-on-merge = true
require-web-commit-signoff = false

# The security settings `repoutils security-settings` checks or changes.
# CodeQL default setup raises code scanning alerts, which we dismiss where
# they don't apply.
[tool.repoutils.security-settings]
private-vulnerability-reporting = false
dependabot-security-updates = true
codeql-default-setup = true
secret-protection = true
push-protection = true
immutable-releases = false

# The deployment environments `repoutils environments` checks or creates.
# Only master can deploy to autofix, which holds AUTOFIX_TOKEN for
# fix-push.yml, so a branch's own copy of a workflow can't read it.
[tool.repoutils.environments.autofix]
deployment-branches = "selected"
allowed-branches = ["master"]
allowed-tags = []

# The rulesets `repoutils rulesets` checks or creates, each giving only what
# differs from a new ruleset's defaults. master changes only by a squash-merged
# PR whose test and screenshot checks passed on an up-to-date head; admins can
# bypass.
[tool.repoutils.rulesets.main]
include = ["~DEFAULT_BRANCH"]
bypass = [{ role = "admin" }]

[tool.repoutils.rulesets.main.rules]
deletion = true
non-fast-forward = true
required-linear-history = true

[tool.repoutils.rulesets.main.rules.pull-request]
allowed-merge-methods = ["squash"]

[tool.repoutils.rulesets.main.rules.required-status-checks]
# "Require branches to be up to date before merging", so a PR's checks ran against what it merges into.
strict-required-status-checks-policy = true
required-status-checks = [
    { context = "post-screenshots", app = "github-actions" },
    { context = "screenshots", app = "github-actions" },
    { context = "test", app = "github-actions" },
]

# The issue and PR labels `repoutils labels` checks or creates (see AGENTS.md's
# Issue labels).
[[tool.repoutils.labels]]
name = "concern:data-integrity"
color = "e4a11b"
description = "Could lose or corrupt data"

[[tool.repoutils.labels]]
name = "concern:security"
color = "fbca04"
description = "Security risk or hardening"

[[tool.repoutils.labels]]
name = "dependencies"
color = "0366d6"
description = "Pull requests that update a dependency file"

[[tool.repoutils.labels]]
name = "priority:p0"
color = "b60205"
description = "Drop everything: prod broken or data at risk"

[[tool.repoutils.labels]]
name = "priority:p1"
color = "e99695"
description = "Do next"

[[tool.repoutils.labels]]
name = "priority:p2"
color = "f9d0c4"
description = "Worth doing when convenient"

[[tool.repoutils.labels]]
name = "priority:p3"
color = "ededed"
description = "Someday/maybe"

# Dependabot adds this one to its uv PRs.
[[tool.repoutils.labels]]
name = "python:uv"
color = "2b67c6"
description = "Pull requests that update python:uv code"

[[tool.repoutils.labels]]
name = "question"
color = "d876e3"
description = "Further information is requested"

[[tool.repoutils.labels]]
name = "size:l"
color = "0e8a16"
description = "Several PRs: should become a parent issue with sub-issues"

[[tool.repoutils.labels]]
name = "size:m"
color = "7fd18b"
description = "One PR that needs some design"

[[tool.repoutils.labels]]
name = "size:s"
color = "c2e0c6"
description = "One small PR"

[[tool.repoutils.labels]]
name = "type:bug"
color = "d73a4a"
description = "Something behaves wrongly"

[[tool.repoutils.labels]]
name = "type:docs"
color = "0075ca"
description = "Documentation only"

[[tool.repoutils.labels]]
name = "type:feature"
color = "0e5a8a"
description = "New capability or module"

[[tool.repoutils.labels]]
name = "type:improvement"
color = "1d76db"
description = "Makes something that already works better"

[[tool.repoutils.labels]]
name = "type:maintenance"
color = "5319e7"
description = "Refactors, dead code, CI, dependencies; no visible change"

# The policy at the top of the exolot PR comment (see AGENTS.md).
[tool.exolot]
preamble = """
**For information only.** For each finding the PR adds, sketch the fix and judge whether the code would be \
better or worse with it: if better, fix it; if worse, leave it be, as findings don't block the PR. \
Don't suppress one with `NOSONAR` or `noqa`. \
See [AGENTS.md](https://github.com/skissane/taxtracker/blob/master/AGENTS.md) for more.
"""

# Project-wide rule settings (see AGENTS.md): only for rules whose findings here are consistently noise.
[tool.exolot.rules]
# Duplicated string literals: mostly URL names reversed a few times, clearer than a constant.
"python:S1192" = { level = "off" }
# Unused parameters: gunicorn hooks and django-google-sso callbacks have fixed signatures.
"python:S1172" = { level = "off" }
# Local variable naming: `User = get_user_model()` and `apps.get_model()` in migrations are Django idiom.
"python:S117" = { level = "off" }
# <li> outside <ul>/<ol>: the admin's object-tools blocks are inside the parent template's <ul>.
"Web:ItemTagNotWithinContainerTagCheck" = { level = "off" }
# Invariant return value: exit-code functions that deliberately always succeed, and views returning the response
# they modified.
"python:S3516" = { level = "off" }
# Argument types: strict mypy checks these, and does a better job of it (this rule misreads policy.default's
# EmailMessage).
"python:S5655" = { level = "off" }
# ModelForm fields = "__all__": the forms are only used by the admin, which picks the fields itself.
"python:S6559" = { level = "off" }
# Consecutive append() calls: appending output lines one at a time is no less clear than extend().
"python:S9409" = { level = "off" }
# Publicly writable directories and world-readable file modes: the app has one user and runs only in its own
# container or on its owner's machine, so there's no other local user to guard against.
"python:S5443" = { level = "off" }
"python:S2612" = { level = "off" }
# Accessibility: the app's one user doesn't need it.
"Web:S6819" = { level = "off" }
"Web:InputWithoutLabelCheck" = { level = "off" }

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID252", "PLC0415", "RUF100", "TC005"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
blank_line_after_tag = "load,extends"
ignore = "H030,H031"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lifetracker.settings"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-n auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/lifetracker", "scripts"]
# So the reports, and diff-cover's patch coverage (--branch-coverage), show
# untaken branches, such as an if whose else never runs.
branch = true
omit = ["*/migrations/*"]
parallel = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = false

[tool.uv]
# Older uv writes uv.lock in an older format; keep CI's and the Dockerfile's pin
# at or above this.
required-version = ">=0.13.5"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
strict = true
files = ["src", "scripts", "tests", "screenshot_tests"]
# Resolve `lifetracker` from src, and `scripts`, `tests` and `screenshot_tests` from the repo root, so each file has
# one module name (otherwise scripts/github_comments.py is both `github_comments` and `scripts.github_comments`).
mypy_path = "src"
explicit_package_bases = true
# Beyond --strict, as in skissane/exolot: unreachable code, unimported types
# that would be Any, and the optional error codes below. explicit-override
# makes every method that overrides one say so with @override, so one that
# stops overriding (the base renamed or removed it) is an error rather than
# silently dead. Not mutable-override, which flags every Django Meta and
# ModelAdmin attribute against django-stubs' types, or disallow_any_decorated,
# which flags Django's view decorators.
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "django_google_sso", "django_google_sso.*", "gunicorn.*", "pdfkit"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "lifetracker.settings"
