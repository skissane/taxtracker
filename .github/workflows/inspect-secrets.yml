name: Inspect Secrets

# Reports what each secret pyproject.toml lists is, to the job summary: each
# GitHub token's type, owner, expiry and the start of its SHA-256 hash, and each
# SSH key's fingerprint, so it can be matched to its row on GitHub's settings
# pages. It never shows a value. It fails if GitHub rejects a token, or it
# expires within 14 days, and warns about any secret a job gets that
# pyproject.toml doesn't list for it. Dependabot secrets can't be inspected, as
# only Dependabot's runs get them.
#
# Run it by hand from master, or with `just inspect-secrets` (see AGENTS.md).
# The job's `if` skips it on other branches, but a branch can edit that, as it
# can any workflow that uses the repository's secrets. The summary is as public
# as the run's logs.
#
# The job runs repoutils' inspect-secrets action, which checks out only
# pyproject.toml, runs repoutils from the action's own commit with the
# runner's python3, installing nothing, and uploads the step summary as the
# artifact step-summaries-<job>-<environment>.
on:
  workflow_dispatch:
    inputs:
      # `repoutils secrets inspect-remote` lists the secret names set at the
      # repository and in each environment, which the run's GITHUB_TOKEN can't,
      # and passes them here as JSON. With them, an environment's job can tell
      # its own secrets from those it inherits from the repository. Left empty,
      # as when started from the Actions page, the environments' summaries say
      # they can't.
      secret-names:
        description: "Secret names at each level, as JSON (filled in by repoutils secrets inspect-remote)"
        required: false
        default: ""

permissions: {}

jobs:
  repository:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect the repository's secrets
        uses: sjktools/repoutils/.github/actions/inspect-secrets@v0.5.4
        with:
          secrets-json: ${{ toJSON(secrets) }}
          secret-names: ${{ inputs.secret-names }}
