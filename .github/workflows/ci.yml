name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    needs: dependabot-fix
    if: ${{ always() && (needs.dependabot-fix.result == 'skipped' || needs.dependabot-fix.outputs.pushed_changes == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the PR base's check runs, before uploading coverage.
      checks: read

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      - name: Check lockfile is up to date
        run: just lock-check

      - name: Check lockfile only targets supported platforms
        run: just lock-os-arch-check

      - name: Install dependencies
        run: just sync

      - name: Check dependency minimum versions
        run: just requirements-check

      - name: Check whitespace in text files
        run: just whitespace-check

      - name: Check AGENTS.md and README.md sentence-per-line formatting
        run: just sentence-per-line-check

      - name: Check nothing is committed under screenshots/
        run: just screenshots-dir-check

      # On a PR, check against the base branch, which is what the squash merge lands on:
      # a commit from the PR itself would pass against HEAD but not once merged.
      - name: Check .git-blame-ignore-revs entries
        env:
          TARGET: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: just blame-ignore-revs-check "$TARGET"

      - name: Lint with ruff
        run: just lint

      - name: Check formatting with ruff
        run: just fmt-check

      - name: Type-check with mypy
        run: just mypy

      - name: Lint with djlint
        run: just lint-templates

      - name: Check formatting with djlint
        run: just fmt-check-templates

      - name: Lint GitHub Actions workflows with jactionlint
        run: just lint-workflows

      - name: Check uv and just version pins
        run: just check-pins

      - name: Check every checkout sets persist-credentials
        run: just check-checkout-credentials

      - name: Check justfile formatting
        run: just just-fmt-check

      # tests/core/test_envoy.py runs the real Envoy with Docker, and fails
      # rather than being skipped without Docker when LIFETRACKER_REQUIRE_ENVOY
      # is set.
      - name: Run tests with coverage
        run: just coverage
        env:
          LIFETRACKER_REQUIRE_ENVOY: "1"

      # Codecov Test Analytics. Runs even if the tests failed, as that's when the
      # results matter most; placed straight after them so a later step's failure
      # can't skip it.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results

      # Kept for post-patch-coverage to post to the PR, for reading without
      # Codecov. Informational only, so it never fails the job: codecov/patch
      # is still the gate. The base is there, as checkout fetched every branch.
      - name: Report patch coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just patch-coverage "origin/$BASE_REF" --format markdown:patch-coverage.md

      - name: Upload patch coverage report
        if: github.event_name == 'pull_request' && hashFiles('patch-coverage.md') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: patch-coverage
          path: patch-coverage.md
          retention-days: 14

      - name: Build Docker image
        run: just docker-build

      - name: Smoke test Docker image
        run: just docker-smoke

      # Hand the tested image to the publish job, so the image pushed to GHCR
      # and deployed is the one built and checked here, not a rebuild. This job only needs
      # read access; pushing happens in publish, which doesn't run repo code.
      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save -o lifetracker-image.tar lifetracker

      - name: Upload Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: docker-image
          path: lifetracker-image.tar
          retention-days: 1

      # Codecov compares a PR with its base's report only when the PR's upload is
      # processed, so wait for the base's (e.g. a stacked PR rebased onto master
      # just as its parent merged, while master's run is still going). It never
      # fails the job, only warns, and is quick when the base's CI has finished.
      - name: Wait for the PR base's coverage on Codecov
        if: github.event_name == 'pull_request'
        run: uv run --no-project python -m scripts.wait_for_base_coverage "$GITHUB_REPOSITORY" "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  # Run `just screenshots` and keep the PNGs as a workflow artifact, for eyeballing
  # UI changes from the run's summary page; post-screenshots then posts them to the
  # PR. A job of its own, so it runs alongside test and installs the screenshots
  # group only here.
  # Same needs/if as test, so it skips a commit dependabot-fix is replacing.
  screenshots:
    needs: dependabot-fix
    if: ${{ always() && (needs.dependabot-fix.result == 'skipped' || needs.dependabot-fix.outputs.pushed_changes == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      # No --with-deps: the runner image already has the system libraries
      # headless Chromium needs, and installing them with apt sometimes took
      # minutes when the Ubuntu mirror was slow. A step of its own so its time
      # shows separately; just screenshots' `playwright install` is a no-op.
      - name: Install Playwright Chromium
        run: uv run --group screenshots playwright install chromium

      # On a PR, the checkout is a merge commit; show the PR's head commit in
      # the admin header instead, the one the screenshot comment names.
      - name: Take screenshots
        env:
          LIFETRACKER_COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: just screenshots

      # Even if a screenshot test failed, the ones taken may show why.
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  # Post the screenshots artifact to the PR as a github-actions[bot] comment, or
  # edit the one posted before. Attachment uploads need a user token, so the
  # images are uploaded with SCREENSHOTS_TOKEN, a fine-grained PAT (the job
  # fails if it's unset); the comment itself is written with GITHUB_TOKEN.
  # Skipped for forks and Dependabot, whose runs don't get the repo's Actions
  # secrets (and whose code shouldn't see the tokens). It runs the PR branch's
  # own script, but installs nothing: the script is stdlib-only and runs with
  # `uv run --no-project`, so no dependency bump runs with the tokens. Queued
  # per PR, so two runs can't both see no previous comment and both post; not in
  # commit order, though, so the script posts only if HEAD_SHA is still the
  # PR's head, lest an older commit's slow run overwrite newer screenshots.
  post-screenshots:
    needs: screenshots
    if: ${{ !cancelled() && needs.screenshots.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Check token configuration
        env:
          SCREENSHOTS_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN }}
        run: |
          if [ -z "$SCREENSHOTS_TOKEN" ]; then
            echo "SCREENSHOTS_TOKEN secret is not set" >&2
            exit 1
          fi

      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      - name: Download screenshots
        uses: actions/download-artifact@v4.3.0
        with:
          name: screenshots
          path: screenshots

      - name: Post screenshots to the PR
        env:
          SCREENSHOTS_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just screenshots-post "$PR_NUMBER" --commit "$HEAD_SHA" --run-url "$RUN_URL" --author 'github-actions[bot]'

  # Post the patch-coverage artifact (diff-cover's Markdown report) to the PR
  # as a github-actions[bot] comment, or edit the one posted before, so it can
  # be read without Codecov. Runs whether or not test then failed (e.g. on
  # the Docker smoke test), but only if test uploaded the report. Skipped, and
  # queued per PR, like post-screenshots, and likewise posts only if HEAD_SHA is
  # still the PR's head. Needs no secrets: it runs the PR branch's stdlib-only
  # script with `uv run --no-project`, installing nothing.
  post-patch-coverage:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-patch-coverage-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      # Missing if the tests failed, or diff-cover did.
      - name: Download patch coverage report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4.3.0
        with:
          name: patch-coverage

      - name: Post patch coverage to the PR
        if: steps.download.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just patch-coverage-post "$PR_NUMBER" --commit "$HEAD_SHA" --run-url "$RUN_URL" --author 'github-actions[bot]'

  # Runs exolot on this repo's code, for information only: --exit-zero, so its
  # findings never fail the job (only a failed analysis does). It reports them
  # as annotations, in the job summary and, on PRs, through post-exolot as a PR
  # comment, with the ones on lines the PR changes first. See AGENTS.md.
  exolot:
    needs: dependabot-fix
    if: ${{ always() && (needs.dependabot-fix.result == 'skipped' || needs.dependabot-fix.outputs.pushed_changes == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXOLOT_CACHE_DIR: ${{ github.workspace }}/.exolot-cache

    steps:
      # The PR's head rather than its merge with the base, so the findings'
      # line numbers and links match the PR's code. Full history so --diff-base
      # can find the lines the PR changes.
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Get pinned server version
        id: server
        run: |
          echo "version=$(uv run --no-sync python -c 'from exolot.server import DEFAULT_SERVER_VERSION as v; print(v)')" >> "$GITHUB_OUTPUT"

      - name: Cache language server
        uses: actions/cache@v4.3.0
        with:
          path: .exolot-cache/servers
          key: exolot-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.server.outputs.version }}

      # On PRs, --diff-base marks the findings on lines the PR changes. The
      # report links to the checked-out commit and this run, and starts with
      # the preamble in pyproject.toml's [tool.exolot]. --annotations also
      # prints the findings on stderr, which the runner shows as annotations
      # on the PR's diff (changed lines first, as GitHub shows only 10 per type).
      - name: Analyze with exolot
        run: |
          args=(--exit-zero --format github-comment --annotations)
          if [ -n "$BASE_REF" ]; then
            args+=(--diff-base "origin/${BASE_REF}")
          fi
          just exolot "${args[@]}" > exolot.md
          cat exolot.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_REF: ${{ github.base_ref }}

      # For post-exolot to post to the PR.
      - name: Upload report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: exolot
          path: exolot.md
          retention-days: 14

  # Posts the exolot job's report to the PR as a new github-actions[bot]
  # comment, and hides the ones earlier runs posted as outdated. The same
  # conditions and precautions as post-patch-coverage: only same-repo,
  # non-Dependabot PRs; queued per PR; posts only if HEAD_SHA is still the PR's
  # head; runs only the PR's stdlib-only script, without installing the
  # project, beside its token.
  post-exolot:
    needs: exolot
    # !cancelled() as dependabot-fix, an ancestor, is skipped on most runs.
    if: ${{ !cancelled() && needs.exolot.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-exolot-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      - name: Download report
        uses: actions/download-artifact@v4.3.0
        with:
          name: exolot

      - name: Post report to the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just exolot-post "$PR_NUMBER" exolot.md --commit "$HEAD_SHA"

  # Lists the files over pyproject.toml's line limit, for information only, in
  # the job summary and, on PRs, as a github-actions[bot] comment edited in
  # place, with the files the PR changes first. The report is cheap to make and
  # its script stdlib-only, so one job both makes and posts it, with the same
  # precautions as post-exolot: only same-repo, non-Dependabot PRs post; queued
  # per PR; posts only if HEAD_SHA is still the PR's head; installs nothing.
  # See AGENTS.md.
  long-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: long-files-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      # The PR's head, as for exolot, so line counts and links match the PR's
      # code. Full history for the merge base with the base branch.
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      - name: List long files
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: just long-files --base "$BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Post report to the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: origin/${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just long-files --base "$BASE" --commit "$HEAD_SHA" --post "$PR_NUMBER" --author 'github-actions[bot]'

  # Checks .github/workflows/actions.lock, which pins every action the
  # workflows use, transitive ones included, to a commit.
  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # The release binary, checked against its SHA-256, so a moved tag or a
      # replaced asset can't swap the verifier. `gh extension install --pin`
      # takes only a release tag for a precompiled extension. The binary runs
      # standalone, reading GH_TOKEN as the extension would.
      - name: Install gh-actions-lock
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gh-actions-lock" \
            https://github.com/github/gh-actions-lock/releases/download/v0.4.1/linux-amd64
          echo "39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e  $RUNNER_TEMP/gh-actions-lock" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gh-actions-lock"

      # Fails if actions.lock is missing an action a workflow uses, or a
      # locked commit no longer verifies upstream. Rerun `gh actions-lock`
      # after changing any `uses:`.
      - name: Verify actions.lock
        run: '"$RUNNER_TEMP/gh-actions-lock" --verify'

  # Runs on a Dependabot branch, whose bumped dependency we don't trust, so the
  # write-capable DEPENDABOT_FIX_TOKEN is only exposed to the final push step:
  # checkout doesn't persist credentials, and nothing installs the project or its
  # dependencies (requirements-fix needs only the standard library). GITHUB_TOKEN
  # is read-only on Dependabot runs whatever this job asks for, so ask for read.
  dependabot-fix:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pushed_changes: ${{ steps.commit-and-push.outputs.pushed }}

    steps:
      - name: Check token configuration
        env:
          DEPENDABOT_FIX_TOKEN: ${{ secrets.DEPENDABOT_FIX_TOKEN }}
        run: |
          if [ -z "$DEPENDABOT_FIX_TOKEN" ]; then
            echo "DEPENDABOT_FIX_TOKEN secret is not set" >&2
            exit 1
          fi

      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.head_ref }}
          # Fetch the base branch and history too, for dependabot-relock's merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3.1.0
        with:
          just-version: "1.58.0"

      # Dependabot's uv may write uv.lock in a newer format than ours, changing
      # lines unrelated to the bump; redo its version changes with our uv.
      - name: Re-lock with the pinned uv
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just dependabot-relock "origin/$BASE_REF"

      - name: Update dependency minimum versions
        run: just requirements-fix

      - name: Update lockfile
        run: uv lock

      # Pushes with DEPENDABOT_FIX_TOKEN, not GITHUB_TOKEN, so the push triggers a
      # new workflow run. If Dependabot updates the branch after checkout, the push
      # fails; the run Dependabot's push triggers redoes the fix.
      - name: Commit and push if needed
        id: commit-and-push
        env:
          DEPENDABOT_FIX_TOKEN: ${{ secrets.DEPENDABOT_FIX_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: re-lock with pinned uv and sync dependency minimum versions"
            git push "https://x-access-token:${DEPENDABOT_FIX_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${HEAD_REF}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  # Check, on PRs too, that the secrets deploy needs are set and FLY_APP names an
  # app the token can see, so a missing or broken setup fails the build rather
  # than only surfacing when master deploys.
  # Skipped for Dependabot, whose runs get Dependabot secrets, not the repo's
  # Actions secrets. Merging its PRs still runs it, as the merger is the actor.
  check-fly:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Check Fly.io secrets and app
        # FLY_API_TOKEN is a deploy token scoped to the app, which can't list
        # apps (that's org-wide), so query the app itself.
        run: |
          : "${FLY_APP:?FLY_APP secret is not set}"
          : "${FLY_API_TOKEN:?FLY_API_TOKEN secret is not set}"
          if ! flyctl status -a "$FLY_APP" >/dev/null; then
            echo "::error::FLY_APP names no app FLY_API_TOKEN can access"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}

  # Push the image the test job built to GHCR, tagged with the commit SHA and
  # latest. Its image output (<repo>@sha256:<digest>) is what deploy deploys.
  # The if: checks needs.test.result itself, rather than relying on the implicit
  # success(), because success() also checks transitive dependencies, and
  # dependabot-fix (test's dependency) is always skipped on master pushes.
  publish:
    needs: [test, actions-lock]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.actions-lock.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4.3.0
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i lifetracker-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        run: |
          docker tag lifetracker "$IMAGE:$GITHUB_SHA"
          docker tag lifetracker "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          # Ask the registry for the digest it stored, rather than reading the
          # local RepoDigests: with Docker's containerd image store (as on
          # ubuntu-26.04) those also list the local name, lifetracker@...,
          # first, which Fly can't pull.
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" == sha256:* ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  # Deploy master to Fly.io once the image is published. The FLY_APP secret
  # holds the app's name (kept out of the public repo; see fly.toml) and
  # FLY_API_TOKEN is a deploy token scoped to that app. Fly pulls the image
  # from GHCR by digest, so it's exactly the one the test job built; that
  # overrides fly.toml's [build] image (:latest), which could have moved on if
  # a later run has published since. The checkout is for fly.toml and the
  # health check script.
  # Like publish, its if: checks its needs explicitly, as the implicit success()
  # would see dependabot-fix skipped and skip this job too.
  deploy:
    needs: [publish, check-fly]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.check-fly.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Queue rather than cancel: a cancelled deploy can leave the Machine half
    # updated, and the later run deploys the newer commit anyway.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly.io
        # Fail rather than fall back to fly.toml's :latest if publish produced
        # no digest. --ha=false only matters if the app has no Machine yet
        # (e.g. its first deploy): the volume attaches to one, so create one.
        run: |
          : "${FLY_APP:?FLY_APP secret is not set}"
          flyctl deploy --ha=false --image "${IMAGE:?publish output no image}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          IMAGE: ${{ needs.publish.outputs.image }}

      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.13.5"

      - name: Check the deployed app is healthy
        # flyctl deploy leaves a stopped Machine stopped, so this request may be
        # what starts it (via Fly Proxy), running the migrations; it fails the
        # job unless /healthz/ reports this commit within the timeout. The
        # script needs only the standard library.
        run: uv run --no-project scripts/check_deploy.py "https://$FLY_APP.fly.dev/healthz/" "$GITHUB_SHA"
        env:
          FLY_APP: ${{ secrets.FLY_APP }}
