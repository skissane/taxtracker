name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"

      - name: Set up Python
        run: uv python install 3.14.3

      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Check lockfile is up to date
        run: just lock-check

      - name: Install dependencies
        run: just sync

      - name: Lint with ruff
        run: just lint

      - name: Check formatting with ruff
        run: just fmt-check

      - name: Lint with djlint
        run: just lint-templates

      - name: Check formatting with djlint
        run: just fmt-check-templates

      - name: Run tests with coverage
        run: just coverage

      - name: Build Docker image
        run: just docker-build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  # Deploy master to Fly.io once everything above passes. FLY_API_TOKEN is a
  # deploy token scoped to the lifetracker-skissane app. fly deploy rebuilds the
  # image on Fly's remote builder rather than reusing the one built above.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Queue rather than cancel: a cancelled deploy can leave the Machine half
    # updated, and the later run deploys the newer commit anyway.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
