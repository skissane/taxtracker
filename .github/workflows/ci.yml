name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    needs: dependabot-fix
    if: ${{ always() && (needs.dependabot-fix.result == 'skipped' || (needs.dependabot-fix.result == 'success' && !needs.dependabot-fix.outputs.head)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For wait-for-base-coverage to read the base commit's check runs and
      # statuses, and the summary step its coverage/project status.
      checks: read
      statuses: read
    outputs:
      # So post-coverage-status posts the coverage statuses, and
      # post-patch-coverage the report, even if a later step fails.
      coverage-report: ${{ steps.coverage-report.outcome }}
      patch-report: ${{ steps.patch-report.outcome }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Check lockfile is up to date
        run: just lock-check

      - name: Install dependencies
        run: just sync

      # For `just check`'s actions-lock-check.
      - name: Install gh-actions-lock
        uses: sjktools/repoutils/.github/actions/install-gh-actions-lock@v0.5.4

      # Every check `just check` runs, so CI and `just check` can't drift apart.
      # GH_TOKEN is the job's read-only token, which is all gh actions-lock
      # needs to verify each locked commit against the action's repository.
      # On a PR, blame-ignore-revs-check checks against the base branch, which
      # is what the squash merge lands on: a commit from the PR itself would
      # pass against HEAD but not once merged.
      - name: Run checks
        env:
          GH_TOKEN: ${{ github.token }}
          BLAME_IGNORE_REVS_TARGET: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: just check

      # tests/core/test_envoy.py runs the real Envoy with Docker, and fails
      # rather than being skipped without Docker when LIFETRACKER_REQUIRE_ENVOY
      # is set.
      - name: Run tests with coverage
        run: just coverage
        env:
          LIFETRACKER_REQUIRE_ENVOY: "1"

      # The lines a PR changes, or on master the lines the commit changes. The
      # base is there, as checkout fetched every branch.
      - name: Report patch coverage
        run: just diff-cover "$BASE" --format markdown:patch-coverage.md,json:patch-coverage.json
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD^' }}

      # For post-coverage-status to post on the commit. Only once the tests
      # pass, as a failed run's coverage isn't the commit's.
      - name: Upload coverage reports
        id: coverage-report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-status
          path: |
            coverage.xml
            patch-coverage.json
          retention-days: 14

      # For post-patch-coverage to post to the PR.
      - name: Upload patch coverage report
        id: patch-report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: patch-coverage
          path: patch-coverage.md
          retention-days: 14

      - name: Build Docker image
        run: just docker-build

      - name: Smoke test Docker image
        run: just docker-smoke

      # Hand the tested image to the publish job, so the image pushed to GHCR
      # and deployed is the one built and checked here, not a rebuild. This job only needs
      # read access; pushing happens in publish, which doesn't run repo code.
      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save -o lifetracker-image.tar lifetracker

      - name: Upload Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-image
          path: lifetracker-image.tar
          retention-days: 1

      # The comparison with the PR's base reads the base commit's
      # coverage/project status, which the base's own post-coverage-status job
      # posts, so wait for it (e.g. a stacked PR rebased onto master just as its
      # parent merged, while master's run is still going). Last, so the Docker
      # steps give the base's run time to finish. It never fails the job, only
      # warns, and is quick when the base's CI has finished.
      - name: Wait for the PR base's coverage status
        if: github.event_name == 'pull_request'
        run: just wait-for-base-coverage "$GITHUB_REPOSITORY" "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      # The comment post-patch-coverage posts, in the job summary, so it's
      # there for fork and Dependabot PRs too, which can't post it.
      - name: Summarise coverage
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/patch-coverage.md"' EXIT
          just patch-coverage-post --output "$GITHUB_STEP_SUMMARY" --coverage-report coverage.xml ${BASE_SHA:+--base "$BASE_SHA"}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # Run `just screenshots` and keep the PNGs as a workflow artifact, for eyeballing
  # UI changes from the run's summary page; post-screenshots then posts them to the
  # PR. A job of its own, so it runs alongside test and installs the screenshots
  # group only here.
  # Same needs/if as test, so it skips a commit dependabot-fix is replacing.
  screenshots:
    needs: dependabot-fix
    if: ${{ always() && (needs.dependabot-fix.result == 'skipped' || (needs.dependabot-fix.result == 'success' && !needs.dependabot-fix.outputs.head)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      # No --with-deps: the runner image already has the system libraries
      # headless Chromium needs, and installing them with apt sometimes took
      # minutes when the Ubuntu mirror was slow. A step of its own so its time
      # shows separately; just screenshots' `playwright install` is a no-op.
      - name: Install Playwright Chromium
        run: uv run --group screenshots playwright install chromium

      # On a PR, the checkout is a merge commit; show the PR's head commit in
      # the admin header instead, the one the screenshot comment names.
      - name: Take screenshots
        env:
          LIFETRACKER_COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: just screenshots

      # Even if a screenshot test failed, the ones taken may show why.
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  # Post the screenshots artifact to the PR as a github-actions[bot] comment, or
  # edit the one posted before. Attachment uploads need a user token, so the
  # images are uploaded with SCREENSHOTS_TOKEN, a fine-grained PAT (the job
  # fails if it's unset); the comment itself is written with GITHUB_TOKEN.
  # Skipped for forks and Dependabot, whose runs don't get the repo's Actions
  # secrets (and whose code shouldn't see the tokens). It runs the PR's base
  # commit's justfile, and installs nothing but repoutils (`uv run
  # --only-group repoutils`), so nothing from the PR runs with the tokens. Queued
  # per PR, so two runs can't both see no previous comment and both post; not in
  # commit order, though, so the script posts only if HEAD_SHA is still the
  # PR's head, lest an older commit's slow run overwrite newer screenshots.
  post-screenshots:
    needs: screenshots
    if: ${{ !cancelled() && needs.screenshots.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Check token configuration
        env:
          SCREENSHOTS_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN }}
        run: |
          if [ -z "$SCREENSHOTS_TOKEN" ]; then
            echo "SCREENSHOTS_TOKEN secret is not set" >&2
            exit 1
          fi

      # The base commit's justfile, pyproject.toml and uv.lock, not the PR's,
      # so a PR's changes to those files don't run beside this job's
      # write-capable token (they take effect once it merges). The workflow
      # file itself still comes from the PR, as in any pull_request run.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download screenshots
        uses: actions/download-artifact@v8.0.2
        with:
          name: screenshots
          path: screenshots

      - name: Post screenshots to the PR
        env:
          SCREENSHOTS_TOKEN: ${{ secrets.SCREENSHOTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just screenshots-post "$PR_NUMBER" --commit "$HEAD_SHA" --run-url "$RUN_URL" --author 'github-actions[bot]'

  # Post the patch-coverage artifact (diff-cover's Markdown report) to the PR
  # as a github-actions[bot] comment, or edit the one posted before, so it's
  # seen without opening the test job's summary. It adds the project's coverage
  # from the coverage-status artifact, and its change from the base's
  # coverage/project status, which the test job waited for, and warns when
  # either falls short (never failing for that). Runs whether or not test then
  # failed (e.g. on the Docker smoke test), but only if test uploaded the
  # report. Skipped, and queued per PR, like post-screenshots, and likewise
  # posts only if HEAD_SHA is still the PR's head. Needs no secrets, runs the
  # base commit's justfile, and installs nothing but repoutils alongside its
  # token (`uv run --only-group repoutils`).
  post-patch-coverage:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.patch-report == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # To read the base commit's coverage/project status.
      statuses: read
    concurrency:
      group: post-patch-coverage-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      # The base commit's justfile, pyproject.toml and uv.lock, not the PR's,
      # so a PR's changes to those files don't run beside this job's
      # write-capable token (they take effect once it merges). The workflow
      # file itself still comes from the PR, as in any pull_request run.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download patch coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: patch-coverage
          path: ${{ runner.temp }}/patch-coverage

      - name: Download coverage reports
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-status
          path: ${{ runner.temp }}/coverage-status

      - name: Post patch coverage to the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORTS: ${{ runner.temp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: |
          just patch-coverage-post "$PR_NUMBER" --commit "$HEAD_SHA" --run-url "$RUN_URL" --author 'github-actions[bot]' \
            --report "$REPORTS/patch-coverage/patch-coverage.md" \
            --coverage-report "$REPORTS/coverage-status/coverage.xml" --base "$BASE_SHA"

  # Posts the test job's figures as two commit statuses, always success:
  # coverage/project, with the change from the PR's base (or on master, the
  # commit's parent) when that has one, and coverage/patch. On a PR they go on
  # its head, and on master on the commit, so master's keep a history of
  # coverage that PRs compare with. Only where GITHUB_TOKEN can post them, so
  # not on a fork's or Dependabot's PR. A token with statuses: write can post a
  # status named like any required check, so, like post-patch-coverage, this
  # job runs the base commit's justfile on PRs and installs nothing but
  # repoutils.
  post-coverage-status:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.coverage-report == 'success' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      # On a PR, the base commit's justfile, pyproject.toml and uv.lock, not
      # the PR's, so a PR's changes to those files don't run beside this job's
      # write-capable token (the workflow file itself still comes from the
      # PR). On master, the commit itself, two commits deep for its parent.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download coverage reports
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-status
          path: ${{ runner.temp }}/coverage-status

      - name: Post coverage as commit statuses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REPORTS: ${{ runner.temp }}/coverage-status
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          base="${PR_BASE:-$(git rev-parse HEAD^)}"
          just coverage-status-post "$COMMIT" --base "$base" --run-url "$RUN_URL" \
            --report "$REPORTS/coverage.xml" --patch-report "$REPORTS/patch-coverage.json"

  # Runs exolot on this repo's code, for information only: --exit-zero, so its
  # findings never fail the job (only a failed analysis does). It reports them
  # as annotations, in the job summary and, on PRs, through post-exolot as a PR
  # comment, with the ones on lines the PR changes first. See AGENTS.md.
  exolot:
    needs: dependabot-fix
    if: ${{ always() && (needs.dependabot-fix.result == 'skipped' || (needs.dependabot-fix.result == 'success' && !needs.dependabot-fix.outputs.head)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXOLOT_CACHE_DIR: ${{ github.workspace }}/.exolot-cache

    steps:
      # The PR's head rather than its merge with the base, so the findings'
      # line numbers and links match the PR's code. Full history so --diff-base
      # can find the lines the PR changes.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Get pinned server version
        id: server
        run: |
          echo "version=$(uv run --no-sync python -c 'from exolot.server import DEFAULT_SERVER_VERSION as v; print(v)')" >> "$GITHUB_OUTPUT"

      - name: Cache language server
        uses: actions/cache@v6.1.0
        with:
          path: .exolot-cache/servers
          key: exolot-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.server.outputs.version }}

      # On PRs, --diff-base marks the findings on lines the PR changes. The
      # report links to the checked-out commit and this run, and starts with
      # the preamble in pyproject.toml's [tool.exolot]. --annotations also
      # prints the findings on stderr, which the runner shows as annotations
      # on the PR's diff (changed lines first, as GitHub shows only 10 per type).
      - name: Analyze with exolot
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/exolot.md"' EXIT
          args=(--exit-zero --format github-comment --annotations)
          if [ -n "$BASE_REF" ]; then
            args+=(--diff-base "origin/${BASE_REF}")
          fi
          just exolot "${args[@]}" > exolot.md
          cat exolot.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_REF: ${{ github.base_ref }}

      # For post-exolot to post to the PR.
      - name: Upload report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: exolot
          path: exolot.md
          retention-days: 14

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # Posts the exolot job's report to the PR as a new github-actions[bot]
  # comment, and hides the ones earlier runs posted as outdated. The same
  # conditions and precautions as post-patch-coverage: only same-repo,
  # non-Dependabot PRs; queued per PR; posts only if HEAD_SHA is still the PR's
  # head; runs the base commit's justfile and installs nothing but repoutils
  # beside its token.
  post-exolot:
    needs: exolot
    # !cancelled() as dependabot-fix, an ancestor, is skipped on most runs.
    if: ${{ !cancelled() && needs.exolot.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: post-exolot-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      # The base commit's justfile, pyproject.toml and uv.lock, not the PR's,
      # so a PR's changes to those files don't run beside this job's
      # write-capable token (they take effect once it merges). The workflow
      # file itself still comes from the PR, as in any pull_request run.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Download report
        uses: actions/download-artifact@v8.0.2
        with:
          name: exolot

      - name: Post report to the PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just exolot-post "$PR_NUMBER" exolot.md --commit "$HEAD_SHA"

  # Lists the files over pyproject.toml's line limit, for information only, in
  # the job summary and, on PRs, as a github-actions[bot] comment edited in
  # place, with the files the PR changes first. The report is cheap to make and
  # needs only repoutils, so one job both makes and posts it, with the same
  # precautions as post-exolot: only same-repo, non-Dependabot PRs post; queued
  # per PR; posts only if HEAD_SHA is still the PR's head; runs the base
  # commit's justfile and installs nothing but repoutils. See AGENTS.md.
  long-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: long-files-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    steps:
      # The justfile, pyproject.toml and uv.lock that run here come from the
      # base commit on PRs (else this commit), as in post-patch-coverage, so
      # nothing from the PR runs beside this job's write-capable token.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      # The PR's head (else this commit), as the data the report is about, as
      # for exolot, so line counts and links match the PR's code; its
      # [tool.repoutils] settings apply. Full history for the merge base with
      # the base branch.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      # The recipe runs in head (it's [no-cd]) with the base's repoutils.
      - name: List long files
        working-directory: head
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/long-files.md"' EXIT
          just --justfile ../justfile long-files --base "$BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Post report to the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: origin/${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just --justfile ../justfile long-files --base "$BASE" --commit "$HEAD_SHA" --post "$PR_NUMBER" --author 'github-actions[bot]'

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # Lists the suppression comments a PR adds (NOSONAR, noqa, type: ignore; see
  # pyproject.toml's [tool.repoutils.added-strings]), for information only, in
  # the job summary and as a github-actions[bot] comment that later runs edit.
  # Like long-files: posts only on same-repo, non-Dependabot PRs, and only once
  # the PR adds one; queued per PR; posts only if HEAD_SHA is still the PR's
  # head.
  added-strings:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: added-strings-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      # The justfile, pyproject.toml and uv.lock that run here come from the
      # PR's base commit, as in post-patch-coverage, so nothing from the PR
      # runs beside this job's write-capable token.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      # The PR's head, as the data the report is about, so lines and links
      # match the PR's code; its [tool.repoutils] settings apply. Full history
      # for the merge base with the base branch.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      # The recipe runs in head (it's [no-cd]) with the base's repoutils.
      - name: List added strings
        working-directory: head
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/added-strings.md"' EXIT
          just --justfile ../justfile added-strings --base "$BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Post report to the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: origin/${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # GITHUB_TOKEN can't look up its own login, so name it.
        run: just --justfile ../justfile added-strings --base "$BASE" --commit "$HEAD_SHA" --post "$PR_NUMBER" --author 'github-actions[bot]'

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore

  # Runs on a Dependabot branch, whose bumped dependency we don't trust, so the
  # write-capable DEPENDABOT_FIX_TOKEN is only exposed to the final push step:
  # checkout doesn't persist credentials, and nothing installs the project or its
  # dependencies (requirements-fix needs only the standard library). GITHUB_TOKEN
  # is read-only on Dependabot runs whatever this job asks for, so ask for read.
  dependabot-fix:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head: ${{ steps.commit.outputs.head }}

    steps:
      # The PR head from the event, which dependabot-push checks the fix is a
      # single commit on, not the branch, which may have moved since.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fetch the base branch and history too, for dependabot-relock's merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      # Dependabot's uv may write uv.lock in a newer format than ours, changing
      # lines unrelated to the bump; redo its version changes with our uv.
      - name: Re-lock with the pinned uv
        env:
          BASE_REF: ${{ github.base_ref }}
        run: just dependabot-relock "origin/$BASE_REF"

      # Also re-locks, as uv.lock records each minimum.
      - name: Update dependency minimum versions
        run: just requirements-fix

      - name: Commit if needed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          start="$(git rev-parse HEAD)"
          git add pyproject.toml uv.lock
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: re-lock with pinned uv and sync dependency minimum versions"
            git bundle create "$RUNNER_TEMP/dependabot-fix.bundle" "$start..HEAD"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the fix
        if: steps.commit.outputs.head
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependabot-fix
          # A re-run of the workflow replaces the previous attempt's bundle.
          overwrite: true
          path: ${{ runner.temp }}/dependabot-fix.bundle
          retention-days: 1
          if-no-files-found: error

  # A fresh runner that runs no code from the Dependabot branch: it checks out
  # the PR head, fetches the bundled commit onto it, checks it changes only
  # pyproject.toml and uv.lock, and pushes it. DEPENDABOT_FIX_TOKEN is a
  # Dependabot secret (only Dependabot's runs can read it) with contents write
  # only, without the workflows permission, so a bundle can't change the
  # workflows either.
  dependabot-push:
    needs: dependabot-fix
    if: needs.dependabot-fix.outputs.head
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      # The PR head from the event, not a dependabot-fix output, which code
      # from the branch could have set.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pushes with DEPENDABOT_FIX_TOKEN, not GITHUB_TOKEN, so the push triggers a
      # new workflow run. The lease makes the push fail unless the branch is still
      # at the PR head this run started from; if Dependabot has updated it, the
      # run Dependabot's push triggers redoes the fix. dependabot-fix ran the
      # bumped dependency's build code, so push-bundle takes only what it is
      # meant to change: one commit on the PR head, touching only pyproject.toml
      # and uv.lock.
      - name: Push the fix
        uses: sjktools/repoutils/.github/actions/push-bundle@v0.5.4
        with:
          token: ${{ secrets.DEPENDABOT_FIX_TOKEN }}
          artifact: dependabot-fix
          branch: ${{ github.head_ref }}
          start: ${{ github.event.pull_request.head.sha }}
          expected-head: ${{ needs.dependabot-fix.outputs.head }}
          single-commit: "true"
          allow-paths: |
            pyproject.toml
            uv.lock

  # Check, on PRs too, that the secrets deploy needs are set and FLY_APP names an
  # app the token can see, so a missing or broken setup fails the build rather
  # than only surfacing when master deploys.
  # Skipped for Dependabot, whose runs get Dependabot secrets, not the repo's
  # Actions secrets. Merging its PRs still runs it, as the merger is the actor.
  check-fly:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Check Fly.io secrets and app
        # FLY_API_TOKEN is a deploy token scoped to the app, which can't list
        # apps (that's org-wide), so query the app itself.
        run: |
          : "${FLY_APP:?FLY_APP secret is not set}"
          : "${FLY_API_TOKEN:?FLY_API_TOKEN secret is not set}"
          if ! flyctl status -a "$FLY_APP" >/dev/null; then
            echo "::error::FLY_APP names no app FLY_API_TOKEN can access"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}

  # Push the image the test job built to GHCR, tagged with the commit SHA and
  # latest. Its image output (<repo>@sha256:<digest>) is what deploy deploys.
  # The if: checks needs.test.result itself, rather than relying on the implicit
  # success(), because success() also checks transitive dependencies, and
  # dependabot-fix (test's dependency) is always skipped on master pushes.
  publish:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i lifetracker-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        run: |
          docker tag lifetracker "$IMAGE:$GITHUB_SHA"
          docker tag lifetracker "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          # Ask the registry for the digest it stored, rather than reading the
          # local RepoDigests: with Docker's containerd image store (as on
          # ubuntu-26.04) those also list the local name, lifetracker@...,
          # first, which Fly can't pull.
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" == sha256:* ]] || { echo "::error::unexpected digest '$digest'"; exit 1; }
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  # Deploy master to Fly.io once the image is published. The FLY_APP secret
  # holds the app's name (kept out of the public repo; see fly.toml) and
  # FLY_API_TOKEN is a deploy token scoped to that app. Fly pulls the image
  # from GHCR by digest, so it's exactly the one the test job built; that
  # overrides fly.toml's [build] image (:latest), which could have moved on if
  # a later run has published since. The checkout is for fly.toml and the
  # health check script.
  # Like publish, its if: checks its needs explicitly, as the implicit success()
  # would see dependabot-fix skipped and skip this job too.
  deploy:
    needs: [publish, check-fly]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.check-fly.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Queue rather than cancel: a cancelled deploy can leave the Machine half
    # updated, and the later run deploys the newer commit anyway.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly.io
        # Fail rather than fall back to fly.toml's :latest if publish produced
        # no digest. --ha=false only matters if the app has no Machine yet
        # (e.g. its first deploy): the volume attaches to one, so create one.
        run: |
          : "${FLY_APP:?FLY_APP secret is not set}"
          flyctl deploy --ha=false --image "${IMAGE:?publish output no image}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ secrets.FLY_APP }}
          IMAGE: ${{ needs.publish.outputs.image }}

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"

      - name: Check the deployed app is healthy
        # flyctl deploy leaves a stopped Machine stopped, so this request may be
        # what starts it (via Fly Proxy), running the migrations; it fails the
        # job unless /healthz/ reports this commit within the timeout. The
        # script needs only the standard library.
        run: uv run --no-project scripts/check_deploy.py "https://$FLY_APP.fly.dev/healthz/" "$GITHUB_SHA"
        env:
          FLY_APP: ${{ secrets.FLY_APP }}
