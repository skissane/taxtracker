name: Claude Code Review

on:
  issue_comment:
    types: [created]
  # "@claude review" in a review comment or a submitted review also comes here,
  # not to claude.yml, which skips it.
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Self-test: a PR that changes this workflow runs its own copy of it, so the
  # change can be checked before it reaches master. See SELF_TEST_PROMPT.
  pull_request:
    paths: ['.github/workflows/claude-code-review.yml']

# A new push supersedes a running self-test, so only the latest report is posted.
# This is set on the workflow rather than the job, so a superseded run's later
# jobs are cancelled too. Other events get a unique group, so they never queue
# or cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('self-test-claude-code-review.yml-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Decides whether the comment or review asks for "@claude review" (it must
  # start with it), by the rule in `repoutils claude-route`, which
  # claude.yml shares, so each request goes to exactly one of the two workflows.
  # Workflow expressions have no regex, hence a job. On a self-test it runs too,
  # with no text, so the self-test covers it.
  route:
    # Only PR comments (not plain issues), review comments and reviews that
    # mention @claude, and only from commenters trusted enough to grant
    # write-scoped access to the token.
    # Self-tests run only for PRs from this repo, as fork PRs get no secrets, and not
    # when Dependabot triggers them: claude-code-action refuses bot actors, and
    # Dependabot's runs get only Dependabot secrets, so no CLAUDE_CODE_OAUTH_TOKEN.
    if: |
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
      contains(github.event.review.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.route.outputs.kind }}
    steps:
      - name: Route
        id: route
        uses: sjktools/repoutils/.github/actions/claude-route@v0.5.4
        with:
          text: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}

  claude-review:
    needs: route
    if: |
      !cancelled() && needs.route.result == 'success' &&
      (github.event_name == 'pull_request' || needs.route.outputs.kind == 'review')

    runs-on: ubuntu-latest
    env:
      # Strip secrets (including the OAuth token) from the environment of
      # commands Claude runs, as the PR it reviews may contain a prompt injection.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      SELF_TEST_PROMPT: |
        This is a self-test, not a normal review. Pull request #${{ github.event.pull_request.number }}
        changes .github/workflows/claude-code-review.yml, and this run uses the PR's copy of
        that workflow so its changes can be checked before they reach master.
        A normal run reviews a PR when someone comments "@claude review" on it.

        Don't review the PR's code and don't change any files. Instead, check that your
        environment lets you do a review, as the workflow intends:

        1. Read the PR's copy of .github/workflows/claude-code-review.yml.
        2. List the tools you have. For each Bash command pattern the workflow allows,
           try one harmless command, e.g. `git diff --stat origin/${{ github.base_ref }}...HEAD`,
           `git log -3 --oneline` and `git show --stat HEAD`, and say whether it worked.
           Run each as a single command: the allowlist checks each part of a compound
           command (`;`, `&&`, a pipe) separately, and refuses it if any part isn't allowed.
        3. Try one Bash command that should be denied, e.g. `curl -sI https://example.com`,
           and say whether it was blocked.
        4. Say whether the Bash sandbox started, and if not, what error you saw.
        5. Try `env` once, and say whether it was blocked. No allowed pattern shows
           environment variables, so it should be. If it was blocked, mark this check
           pass; if it ran, mark it fail, report the allowlist letting it run as a
           problem, and say whether CLAUDE_CODE_OAUTH_TOKEN, GITHUB_TOKEN, GH_TOKEN and
           ACTIONS_ID_TOKEN_REQUEST_TOKEN are set, never printing their values. Either
           way, this checks only the allowlist: no allowed command can show whether the
           scrub works, so say that the scrub itself is unverified.
        6. Note anything in the workflow that looks likely to stop a normal review working.

        Your final message is posted as a comment on the PR, so make it a short Markdown
        report with no heading, as the workflow adds one: a table of each check with pass,
        fail or skipped, then any problems found.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # claude-code-action sets up its own git credentials.
          persist-credentials: false
          fetch-depth: 0

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB isolates Claude's commands with
      # bubblewrap, which needs these packages and unprivileged user namespaces.
      # Without them Claude has no Bash at all. Mirrors the step the action runs
      # itself when allowed_non_write_users is set.
      - name: Install subprocess isolation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: 'true'
          # A self-test's workflow differs from master's, so the Claude app refuses
          # to give it a token; use the job's own token for those runs only.
          github_token: ${{ github.event_name == 'pull_request' && github.token || '' }}
          prompt: ${{ github.event_name == 'pull_request' && env.SELF_TEST_PROMPT || '' }}
          additional_permissions: |
            actions: read
          # The action's default tools can't diff, only commit and push. No just:
          # the action puts its write-capable token in .git/config, where the
          # PR's own recipes and tests could read it. CI runs them instead, and
          # Claude can read the results. See
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          claude_args: '--allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)"'

      - name: Extract self-test report
        id: self-test-report
        if: always() && github.event_name == 'pull_request'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          trap 'mkdir -p "$RUNNER_TEMP/step-summaries" && cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/step-summaries/self-test-report.md"' EXIT
          report=$(jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          if [ -z "$report" ]; then
            report="Claude produced no report. See the [workflow run]($RUN_URL)."
          fi
          report="### Self-test of claude-code-review.yml"$'\n\n'"$report"
          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$report" > "$RUNNER_TEMP/self-test-report.md"
          echo "report=$RUNNER_TEMP/self-test-report.md" >> "$GITHUB_OUTPUT"

      # Posts a new report and hides this workflow's earlier ones as outdated.
      - name: Comment self-test report on PR
        if: always() && steps.self-test-report.outputs.report != ''
        uses: sjktools/repoutils/.github/actions/post-comment@v0.5.4
        with:
          pr: ${{ github.event.pull_request.number }}
          body: ${{ steps.self-test-report.outputs.report }}
          name: self-test-claude-code-review.yml
          hide-previous: "true"

      # GitHub's API doesn't serve step summaries, so each step that writes one
      # copies it to step-summaries/ for this artifact (see AGENTS.md).
      - name: Upload the step summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: step-summaries-${{ github.job }}
          path: ${{ runner.temp }}/step-summaries/
          if-no-files-found: ignore
