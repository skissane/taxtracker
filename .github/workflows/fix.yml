name: PR Fixes

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10

    steps:
      - name: Ensure workflow is running on a PR branch
        id: check-pr
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          PR_INFO=$(gh pr view "$BRANCH_NAME" --json baseRefName --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "not_found")

          if [ "$PR_INFO" = "not_found" ]; then
            echo "::error::This workflow can only be triggered on a pull request branch."
            exit 1
          fi

          BASE_BRANCH=$(echo "$PR_INFO" | jq -r .baseRefName)
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge base branch
        run: |
          BASE_BRANCH="${{ steps.check-pr.outputs.base_branch }}"
          git fetch origin "$BASE_BRANCH"

          if ! git merge "origin/$BASE_BRANCH" --no-edit; then
            echo "::error::Merge conflict with base branch $BASE_BRANCH. Please resolve conflicts manually."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"

      - name: Set up Python
        run: uv python install 3.14.9

      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Run fixes
        run: just fix

      - name: Commit and push changes
        run: |
          git add -u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: apply automated fixes"
            git push
          fi
