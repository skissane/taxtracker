# The cooldown skips releases younger than a week, so a compromised release has
# time to be noticed and pulled before it lands here.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"

  # Workflows name actions by version tag, and .github/workflows/actions.lock
  # pins each to a commit; Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "type:maintenance"
