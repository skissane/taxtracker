# The cooldown skips releases younger than a week, so a compromised release has
# time to be noticed and pulled before it lands here.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
    # repoutils' Bump downstream workflow bumps it, along with its actions, at
    # each release, as `just check-pins` needs both at one commit.
    ignore:
      - dependency-name: "repoutils"

  # Workflows name actions by version tag, and .github/workflows/actions.lock
  # pins each to a commit; Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # See the uv entry's repoutils ignore. The wildcard also covers names that
    # carry an action's path.
    ignore:
      - dependency-name: "sjktools/repoutils*"
    labels:
      - "dependencies"
      - "type:maintenance"

  # The Dockerfile's base images, chiefly Envoy, the auth proxy in front of
  # the app, which otherwise changes only when someone edits its tag.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # `just check-pins` needs this tag to match [tool.uv] required-version
      # and the workflows' setup-uv versions, so all three move together, by hand.
      - dependency-name: "ghcr.io/astral-sh/uv"
      # python:3.14-slim already gets each patch release on rebuild; a new
      # minor goes with requires-python and CI's Python, by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "type:maintenance"
